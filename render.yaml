# LatruxTrade — Render Blueprint
# Deploy: https://render.com/deploy

services:
  # ─── Frontend (Next.js) ────────────────────────────────────
  - type: web
    name: latrux-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: latrux-backend
          property: host
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: latrux-frontend
          property: host
          envVarKey: RENDER_EXTERNAL_URL

  # ─── Backend (NestJS) ──────────────────────────────────────
  - type: web
    name: latrux-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: latrux-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: latrux-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: latrux-frontend
          property: host
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_EMAIL
        value: christophermuto81@gmail.com
      - key: PORT
        value: "4000"

  # ─── Background Worker (Signal Engine) ─────────────────────
  - type: worker
    name: latrux-worker
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: latrux-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: latrux-redis
          property: connectionString
      - key: WORKER_MODE
        value: "true"

databases:
  - name: latrux-db
    plan: free
    databaseName: latrux_trade
    user: latrux

  - name: latrux-redis
    plan: free
